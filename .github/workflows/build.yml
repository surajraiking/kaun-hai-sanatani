name: Build Expo Android APK & Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract Project ZIP
        run: |
          unzip -o "kaun-hai-sanatani-fixed.zip"
          ROOT_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$ROOT_DIR" >> $GITHUB_ENV

      - name: Install Dependencies & Expo CLI
        run: |
          cd "$PROJECT_DIR"
          export CI=true
          # Fix app.json package name
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json"));
              if (!app.expo) app.expo = {};
              if (!app.expo.android) app.expo.android = {};
              if (!app.expo.android.package) app.expo.android.package = "com.kaunhaisanatani.app";
              fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            }
          '
          npm install --legacy-peer-deps --force
          npm install -g @expo/cli

      - name: Prebuild Native Android
        run: |
          cd "$PROJECT_DIR"
          export CI=true
          npx expo prebuild --platform android --clean --no-install

      - name: Compile APK & Bundle
        run: |
          cd "$PROJECT_DIR/android"
          # Gradle configuration without disabling newArch
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.parallel=false
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          chmod +x gradlew
          # Build APK and AAB with info logging to suppress daemon crash
          ./gradlew assembleRelease bundleRelease -x lint -x test --no-daemon || ./gradlew assembleDebug bundleDebug -x lint -x test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaun-hai-sanatani-apk
          path: "**/build/outputs/apk/**/*.apk"

      - name: Upload AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaun-hai-sanatani-bundle
          path: "**/build/outputs/bundle/**/*.aab"
          
