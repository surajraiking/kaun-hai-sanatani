name: Build Expo Android APK & Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          unzip -o "kaun-hai-sanatani-fixed.zip"
          # Find directory containing package.json
          ROOT_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$ROOT_DIR" >> $GITHUB_ENV

      - name: Install Project Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Generate Native Android Folder (Expo Prebuild)
        run: |
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --no-install --clean

      - name: Build Debug APK & AAB Bundle
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaun-hai-sanatani-apk
          path: "**/android/app/build/outputs/apk/debug/*.apk"

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaun-hai-sanatani-bundle
          path: "**/android/app/build/outputs/bundle/debug/*.aab"
          
