name: Unpack, Auto-Detect and Build APK & Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Archive
        run: |
          unzip -o "kaun-hai-sanatani-fixed.zip"
          echo "=== UNZIPPED CONTENTS ==="
          ls -la

      - name: Build Android Project
        run: |
          # 1. Agar Native Android project hai jisme gradlew missing tha:
          if find . -name "build.gradle*" | grep -q .; then
            GRADLE_DIR=$(dirname $(find . -name "build.gradle*" | head -n 1))
            cd "$GRADLE_DIR"
            if [ ! -f "gradlew" ]; then
              gradle wrapper
              chmod +x gradlew
            fi
            ./gradlew assembleDebug --no-daemon
            ./gradlew bundleDebug --no-daemon
          
          # 2. Agar Web App / Node / HTML app hai to Capacitor se Android APK banayein:
          elif [ -f "package.json" ] || [ -f "index.html" ]; then
            echo "Web app detected. Wrapping with Capacitor..."
            npm init -y || true
            npm install @capacitor/core @capacitor/cli @capacitor/android
            npx cap init "Kaun Hai Sanatani" "com.sanatani.quiz" --web-dir .
            npx cap add android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            ./gradlew bundleDebug --no-daemon
          else
            echo "Unknown project structure!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/**/*.apk"

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-bundle
          path: "**/build/outputs/bundle/**/*.aab"
          
