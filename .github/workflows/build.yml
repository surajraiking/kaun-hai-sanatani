name: Build Expo Android APK & Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Set Swap
        run: |
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project ZIP
        run: |
          unzip -o "kaun-hai-sanatani-fixed.zip"
          ROOT_DIR=$(dirname $(find . -name "package.json" | head -n 1))
          echo "PROJECT_DIR=$ROOT_DIR" >> $GITHUB_ENV

      - name: Configure Package & Build Environment
        run: |
          cd "$PROJECT_DIR"
          
          # CI non-interactive env setup
          echo "CI=true" >> $GITHUB_ENV
          
          # Ensure android package name exists in app.json
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json"));
              if (!app.expo) app.expo = {};
              if (!app.expo.android) app.expo.android = {};
              if (!app.expo.android.package) app.expo.android.package = "com.kaunhaisanatani.app";
              fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            }
          '
          
          # Clean npm install
          npm install --legacy-peer-deps --force

      - name: Generate Android Native Project
        run: |
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle Memory & Permissions
        run: |
          cd "$PROJECT_DIR/android"
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          chmod +x gradlew

      - name: Compile APK and AAB Bundle
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaun-hai-sanatani-apk
          path: "**/android/app/build/outputs/apk/debug/*.apk"

      - name: Upload AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaun-hai-sanatani-bundle
          path: "**/android/app/build/outputs/bundle/debug/*.aab"
          
